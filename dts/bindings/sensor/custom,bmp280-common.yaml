description: BMP280 pressure and temperature sensor. Common properties
include: sensor-device.yaml
properties:
  mode:
    type: int
    required: false
    default: 0 #BMP280_MODE_SLEEP
    description: |
      Initial power mode index. 
      Refer to <dt-bindings/sensor/custom_bmp280.h> for valid indices.
  t-standby:
    type: int
    required: false
    default: 0 #BMP280_T_STANDBY_0_5MS
    description: |
      Time between maserements in normal mode. THIS IS INDEX.
      Refer to <dt-bindings/sensor/custom_bmp280.h> for valid indices.
  iir-filter:
    type: int
    required: false
    default: 0 #BMP280_FILTER_OFF
    description: |
      IIR Filter coefficient. THIS IS INDEX.
      Refer to <dt-bindings/sensor/custom_bmp280.h> for valid indices.
  temperature-oversampling:
    type: int
    required: false
    default: 1 #BMP280_OVERSAMPLING_X1
    description: |
      Temperature oversampling. THIS IS INDEX.
      Refer to <dt-bindings/sensor/custom_bmp280.h> for valid indices.
  pressure-oversampling:
    type: int
    required: false
    default: 1 #BMP280_OVERSAMPLING_X1
    description: |
      Temperature oversampling. THIS IS INDEX.
      Refer to <dt-bindings/sensor/custom_bmp280.h> for valid indices.

