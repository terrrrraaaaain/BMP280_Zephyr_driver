description: BMP280 pressure and temperature sensor
compatible: "custom,bmp280"
on-bus: spi
include: 
  - custom,bmp280-common.yaml
  - spi-device.yaml

properties:
  spi-3-wire-enable:
    type: boolean
    required: false
    description: |
      SPI 3 Wire ON/OFF. SPI 4 Wire instead if not present.
      
